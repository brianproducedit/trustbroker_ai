name: TrustBroker AI Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react_app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check (TypeScript)
        run: npx tsc -b

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: react_app/dist
          retention-days: 7

  deploy-render:
    name: Deploy to Render (Free Static Site)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning title=Render Deploy Hook Not Configured::RENDER_DEPLOY_HOOK_URL secret is not set in repository secrets. Skipping Render webhook call. (Render will still automatically deploy on Git push if connected to the GitHub repository directly)."
            echo "### ⚠️ Render Deploy Notice" >> $GITHUB_STEP_SUMMARY
            echo "The CI build succeeded, but the Render webhook was skipped because \`RENDER_DEPLOY_HOOK_URL\` is not yet defined in your GitHub repository secrets." >> $GITHUB_STEP_SUMMARY
            echo "If your Render service is connected via GitHub integration, Render will deploy automatically from the \`main\` branch commit." >> $GITHUB_STEP_SUMMARY
            echo "To trigger instant deployments via webhook, create a Deploy Hook in your Render dashboard and save it as \`RENDER_DEPLOY_HOOK_URL\` in GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "Triggering Render deployment webhook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Render API Response Code: $HTTP_CODE"
            echo "Response: $BODY"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render deployment successfully initiated!"
              echo "### 🚀 Render Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
              echo "Render deploy hook triggered successfully (HTTP $HTTP_CODE)." >> $GITHUB_STEP_SUMMARY
            else
              echo "::error::Render deploy hook returned status $HTTP_CODE"
              exit 1
            fi
          fi
